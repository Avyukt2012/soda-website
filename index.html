<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Soda | Pure Zero Refreshment</title>
    <meta name="description" content="Experience the crisp, clean taste of Diet Soda. Zero sugar, zero compromise.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.getlayers.ai" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;700&family=Galada&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/hero.css">

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
        "gsap": "https://esm.sh/gsap@3.13.0",
        "gsap/ScrollTrigger": "https://esm.sh/gsap@3.13.0/ScrollTrigger",
        "gsap/SplitText": "https://esm.sh/gsap@3.13.0/SplitText",
        "gsap/DrawSVGPlugin": "https://esm.sh/gsap@3.13.0/DrawSVGPlugin",
        "lenis": "https://unpkg.com/lenis@1.1.0/dist/lenis.mjs"
      }
    }
    </script>
</head>

<body>
    <canvas id="gl"></canvas>
    <div id="bubbles-container"></div>

    <header class="header">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>Soda</span>
        </div>
        <nav class="nav">
            <a href="#" class="nav-item active">Home</a>
            <a href="#" class="nav-item">Ingredients</a>
            <a href="#" class="nav-item">Taste</a>
            <a href="#" class="nav-item">Eco</a>
            <a href="#" class="nav-item">Reviews</a>
        </nav>
        <button class="contact-btn">Contact Us</button>
    </header>

    <main>
        <section class="hero" id="act-hero">
            <div class="hero-content">
                <div class="hero-left">
                    <h1 class="main-title">
                        <span class="outline">Pure</span><br>
                        Zero
                    </h1>
                    <p class="description">
                        Unleash the crisp taste of zero sugar. <br>
                        Refreshment redefined in every bubble — <br>
                        all in one sleek design.
                    </p>
                    <div class="cta-group">
                        <button class="primary-btn">
                            Shop Now
                            <span class="plus-icon">+</span>
                        </button>
                    </div>
                    <div class="award-badge">
                        <div class="award-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 15L15 18L19 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                        <div class="award-text">
                            <span class="award-title">DESIGN AWARDS</span>
                            <span class="award-subtitle">PREMIUM BEVERAGE 2025</span>
                        </div>
                    </div>
                </div>

                <div class="hero-right">
                    <div class="product-carousel">
                        <div class="carousel-cards">
                            <div class="card active" data-flavor="classic">
                                <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Green%20Soda.png" alt="Diet Classic">
                                <div class="card-info">
                                    <span>Diet Classic</span>
                                    <span>$2.99</span>
                                </div>
                            </div>
                            <div class="card" data-flavor="blue">
                                <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Blue%20Soda.png" alt="Zero Lime" style="filter: brightness(0.7);">
                                <div class="card-info">
                                    <span>Zero Lime</span>
                                    <span>$2.99</span>
                                </div>
                            </div>
                        </div>
                        <div class="carousel-nav">
                            <button class="nav-arrow" data-dir="-1">←</button>
                            <button class="nav-arrow" data-dir="1">→</button>
                        </div>
                    </div>
                    <h2 class="side-title">
                        <span class="outline">Refreshingly</span><br>
                        Clean
                    </h2>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
